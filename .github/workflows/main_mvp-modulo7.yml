name: Build and deploy Python app to Azure Web App - MVP-Modulo7

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Create and Start virtual environment and Install dependencies
        run: |
          cd backend
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            backend/
            !backend/antenv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_48B9B07D3AEC422AB3E6DCDB8D9DDFD6 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3B2169287CBC46AB84249B330EB8B323 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D3F0FC9243664EF2956DBDC0439EC51C }}

      - name: Upload artifact for deployment jobs
    uses: actions/upload-artifact@v4
    with:
      name: python-app
      path: backend/

  # (No job de deploy, garanta que o pacote aponte para o diretório atual do artefato baixado)
  - name: 'Deploy to Azure Web App'
    uses: azure/webapps-deploy@v3
    id: deploy-to-webapp
    with:
      app-name: 'MVP-Modulo7'
      package: .
